name: Daily AEO Dashboard

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install
        run: pip install -r requirements.txt

      - name: Audit site + GSC + build dashboard (DRAFTS ONLY)
        continue-on-error: true
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          SHOPIFY_STORE:       ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          GSC_CREDENTIALS_JSON: ${{ secrets.GSC_CREDENTIALS_JSON }}
        run: |
          if [ "$(date -u +%u)" = "7" ]; then MODE=weekly; else MODE=daily; fi
          echo "Crawl mode: $MODE"
          python morning_digest.py || true
          python crawl_site.py --mode "$MODE" || true
          python gsc_report.py --inspect 120 || true
          python build_dashboard.py

      - name: Upload dashboard for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Save history back to repo
        continue-on-error: true
        run: |
          git config user.name  "aeo-agent"
          git config user.email "aeo-agent@users.noreply.github.com"
          git add baselines digest pending-fixes crawl-results.json gsc-results.json 2>/dev/null || true
          git commit -m "daily audit $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push || echo "push skipped"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
