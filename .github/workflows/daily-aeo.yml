name: Daily AEO Dashboard

# 03:30 UTC = 09:00 IST daily. Also runnable on demand from the Actions tab.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install
        run: pip install -r requirements.txt

      - name: Run audit + build dashboard (DRAFTS ONLY — no live writes)
        continue-on-error: true
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          SHOPIFY_STORE:       ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
        run: |
          python morning_digest.py
          python build_dashboard.py

      - name: Upload dashboard for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Save history back to repo (for the trend line)
        continue-on-error: true
        run: |
          git config user.name  "aeo-agent"
          git config user.email "aeo-agent@users.noreply.github.com"
          git add baselines digest pending-fixes 2>/dev/null || true
          git commit -m "daily audit $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push || echo "push skipped"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
